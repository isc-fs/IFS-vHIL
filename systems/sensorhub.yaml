kind: system
id: sensorhub
description: >-
  One SensorHub on its two CAN buses, with its on-board BMI088. Its firmware is
  not in the catalogue, so a run gives the image at render
  (`--firmware sensorhub=<elf>`). The base for SensorHub tests: add the
  sensors a test needs as devices.
time:
  quantum_s: 0.0005
boards:
  # The board has no roles and no CAN bootloader: its image boots from the
  # vector table at 0x08000000.
  sensorhub: {board: sensorhub}
buses:
  # Which car bus each one joins is not traced yet (docs/boards/sensorhub.md).
  can1: {kind: can, nodes: [sensorhub.CAN1]}  # CAN1_H/L, J1.9/J1.10
  can2: {kind: can, nodes: [sensorhub.CAN2]}  # CAN2_H/L, J1.11/J1.12
devices:
  # The on-board BMI088 on SPI3: CSB1 (accelerometer) PC4, CSB2 (gyroscope)
  # PC5 (catalog/boards/sensorhub.yaml). The MainLite's is on I2C2.
  imu: {model: bmi088, spi: sensorhub.SPI3, pins: {csb1: sensorhub.PC4, csb2: sensorhub.PC5}}
  # A ZED-F9P RTK receiver on J1's I2C2 (PB10 SCL J1.13 / PB11 SDA J1.14), at
  # its default address 0x42. The receiver is not on the board: it is an
  # external part on J1. On SPI it would be spi: sensorhub.SPI1, cs: sensorhub.PA4.
  # Its UART2 is left open for Inés to wire once the car's correction link is
  # decided: to a board UART with uarts: {uart2: sensorhub.<USART>}, or to a
  # radio, which tests stand in for with `InjectUart2 "<hex>"`.
  gnss: {model: zed-f9p, i2c: sensorhub.I2C2}
