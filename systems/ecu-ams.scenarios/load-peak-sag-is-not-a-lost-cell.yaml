kind: scenario
system: ecu-ams
description: "A healthy pack under an acceleration peak, on the pack fitted to the car (#318 pack plant; catalog/plants/tractive-system.yaml parameter set car-log0077: car SD log LOG0077, 2026-09-29, scripts/fit_pack.py): per-element R0 (3.70 mOhm mean at 21.9 C), RC 2.46 mOhm / 10 s and static OCV offsets, at the state the log ends in (rest 3.734 V/element mean: SoC 0.584 on the OCV table, c3_0 the weakest at 3.592 V; 21.9 C). Armed to Run, then the inverter draws 240 A DC for 1 s from 11 s. On this pack the lowest element reads under CellUnderVoltageMv (2800, ams_config.hpp:22) from ~217 A (c4_11: offset -53 mV, R0 4.05 mOhm); 240 A takes it to ~2.70 V, still above the VTC6's 2.5 V. Amplitude: under the ECU's 76 kW TS power envelope on this sagged pack (IFS08-CE-ECU ecu_config.hpp:353: ~317 A), and under the AMS's CurrentOverLimit for 1 s (185 A on the ~0.8 s IIR, ams_config.hpp:127-153: ~172 A after 1 s), so a peak the firmware means to carry. The AMS compares the raw cell reading with that threshold, uncompensated for the pack current it measures (safety_predicates.hpp:213-217; the same range path is its out-of-range lost-cell detector, AMS #502), confirms it over CellFaultConfirmTicks (25 x 10 ms) and latches Error, reason CellUnderVoltage (4), opening the SDC. Intent: a healthy cell under load is not a lost measurement and the car keeps driving; the expects on that are strict expected failures on IFS08-CE-AMS#641. ADOW (CellOpenWire, 16) must not fire on the sag."
virtual_ms: 14000
tags: [beyond-bench]
stimuli:
  - {kind: plant, name: car-pack-at-log0077-end, at_ms: 0, plant: ts, set: {parameter_set: car-log0077, soc_init: 0.584, t_init: 295.05}}
  - {kind: plant, name: sdc-reset, at_ms: 5400, plant: sdc, set: {reset: true}}
  - {kind: plant, name: sdc-reset-release, at_ms: 5450, plant: sdc, set: {reset: false}}
  - {kind: plant, name: tsms-on, at_ms: 5500, plant: sdc, set: {tsms: true}}
  - {kind: gpio, name: dash-press, at_ms: 5600, board: ams, pin: PF10, level: true}
  - {kind: gpio, name: dash-release, at_ms: 5650, board: ams, pin: PF10, level: false}
  - {kind: plant, name: launch-240a, at_ms: 11000, plant: ts, set: {i_inverter_dc: 240}}
  - {kind: plant, name: lift-off, at_ms: 12000, plant: ts, set: {i_inverter_dc: 0}}
watch:
  - {kind: symbol, board: ams, name: g_state_telemetry, size: 1, period_ms: 10}
  - {kind: symbol, board: ams, name: g_fault_reason_telemetry, size: 1, period_ms: 10}
expect:
  - {check: eventually, name: ams-run, at_ms: 5600, until_ms: 10600, signal: "symbol:ams.g_state_telemetry", value: 3}
  - {check: always, name: no-error-at-rest, at_ms: 0, until_ms: 11000, signal: "symbol:ams.g_state_telemetry", op: "!=", value: 5}
  - {check: eventually, name: the-pack-carries-240a, at_ms: 11000, until_ms: 11100, signal: "plant:ts.i_pack", value: 240}
  - {check: eventually, name: cells-sag-under-the-threshold, at_ms: 11000, until_ms: 11100, signal: "plant:ts.v_cell_min", op: "<", value: 2.8}
  - {check: never, name: no-cell-sags-out-of-datasheet-range, at_ms: 0, signal: "plant:ts.v_cell_min", op: "<", value: 2.5}
  - {check: eventually, name: the-ams-reads-the-load, at_ms: 11000, until_ms: 11500, signal: "frame:can_acu.ACU_currents.current_accu_dA", op: ">", value: 50}
  - {check: eventually, name: the-ams-sees-the-sag, at_ms: 11000, until_ms: 11500, signal: "frame:can_acu.ACU_v_cell_min.min_cell_mV", op: "<", value: 2800}
  - {check: never, name: no-false-open-wire, at_ms: 0, signal: "symbol:ams.g_fault_reason_telemetry", value: 16}
  - {check: never, name: no-error-under-load, at_ms: 11000, signal: "symbol:ams.g_state_telemetry", value: 5, xfail: "isc-fs/IFS08-CE-AMS#641"}
  - {check: never, name: no-under-voltage-latch, at_ms: 11000, signal: "symbol:ams.g_fault_reason_telemetry", value: 4, xfail: "isc-fs/IFS08-CE-AMS#641"}
  - {check: never, name: air-plus-stays-closed, at_ms: 11000, signal: "plant:ts.air_pos_closed", value: 0, xfail: "isc-fs/IFS08-CE-AMS#641"}
