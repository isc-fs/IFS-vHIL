name: App

# The desktop app (app/, #373) on every pull request that changes it, and on
# a release tag, attached to that tag's release and published to the team's
# app store, isc-fs/iskapps (release vhil-v<x.y.z> + vhil/latest.json, which
# the app's updater reads):
#
#   macOS    ISC vHIL_<v>_universal.dmg          Apple silicon + Intel, ad-hoc signed
#   Linux    ISC vHIL_<v>_amd64.deb, .AppImage   x86_64
#   Windows  ISC vHIL_<v>_x64-setup.exe          per-user NSIS installer; runs bin/vhil in WSL2
#
# A tag build also signs the update bundles (.sig, minisign) with the
# TAURI_SIGNING_PRIVATE_KEY secret; the app checks them against the public
# key in tauri.conf.json. Other builds make no update bundles.
#
# None is notarised or code-signed with a certificate: app/README.md says how
# a teammate opens it the first time. The runners' preinstalled rustup and
# Node build it; the Tauri crates and CLI are pinned in
# app/src-tauri/Cargo.toml (+ Cargo.lock) and app/package-lock.json.

on:
  pull_request:
    paths: [app/**, .github/workflows/app.yml]
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos
            runner: macos-latest
            args: --target universal-apple-darwin --bundles app,dmg
            out: |
              app/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
              app/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz*
          - os: linux
            # The oldest supported Ubuntu: the AppImage and .deb then run on
            # newer distributions too (glibc).
            runner: ubuntu-22.04
            args: --bundles deb,appimage
            out: |
              app/src-tauri/target/release/bundle/deb/*.deb*
              app/src-tauri/target/release/bundle/appimage/*.AppImage*
          - os: windows
            runner: windows-latest
            args: --bundles nsis
            out: app/src-tauri/target/release/bundle/nsis/*-setup.exe*
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: write   # attach the bundles to a release
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust targets (macOS universal)
        if: matrix.os == 'macos'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: System libraries (Linux; Tauri's prerequisites)
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
              librsvg2-dev libayatana-appindicator3-dev patchelf file
      - run: npm ci --no-audit --no-fund
      - name: Release version
        # A release build follows its tag: the app's version, and the ref its
        # own clone of the repository checks out (VHIL_APP_REF, main.rs).
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          npm pkg set version="${TAG#v}"
          echo "VHIL_APP_REF=$TAG" >> "$GITHUB_ENV"
      - name: Build
        env:
          ARGS: ${{ matrix.args }}
          # Only a tag build signs (and so makes) the update bundles.
          TAURI_SIGNING_PRIVATE_KEY: ${{ github.ref_type == 'tag' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ github.ref_type == 'tag' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: |
          read -ra args <<<"$ARGS"
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
              args+=(--config '{"bundle":{"createUpdaterArtifacts":false}}')
          fi
          npx tauri build "${args[@]}"
      - name: Check the macOS bundle
        if: matrix.os == 'macos'
        run: |
          app="src-tauri/target/universal-apple-darwin/release/bundle/macos/ISC vHIL.app"
          lipo -archs "$app/Contents/MacOS/vhil-app"
          codesign -dv "$app" 2>&1 | grep -E "Signature|Identifier"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vHIL-${{ matrix.os }}
          path: ${{ matrix.out }}
          if-no-files-found: error
          retention-days: 14
      - name: Attach to the release
        # The release is Raúl's to create; the bundles join it if it exists.
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          OUT: ${{ matrix.out }}
        working-directory: .
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
              echo "no release $TAG yet: the bundles are the run's artifacts" >> "$GITHUB_STEP_SUMMARY"
              exit 0
          fi
          files=()
          while read -r glob; do
              [ -n "$glob" ] || continue
              while read -r f; do files+=("$f"); done < <(compgen -G "$glob")
          done <<<"$OUT"
          gh release upload "$TAG" "${files[@]}" --clobber

  publish-iskapps:
    # The team's app store: the installers and update bundles as release
    # vhil-v<x.y.z> of isc-fs/iskapps, and vhil/latest.json on its main
    # (the updater's endpoint). Needs the ISKAPPS_TOKEN org secret
    # (contents: write on isc-fs/iskapps); skipped with a warning without it.
    name: publish to iskapps
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read     # this run's artifacts
    steps:
      - name: Release + manifest
        env:
          TAG: ${{ github.ref_name }}
          RUN: ${{ github.run_id }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          ISKAPPS_TOKEN: ${{ secrets.ISKAPPS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$ISKAPPS_TOKEN" ]; then
              echo "::warning::ISKAPPS_TOKEN not set: not published to iskapps"
              exit 0
          fi
          version="${TAG#v}"
          app_tag="vhil-$TAG"
          gh run download "$RUN" --repo "$REPO" --dir dist
          mkdir up
          find dist -type f -exec mv {} up/ \;
          cd up
          # GitHub turns spaces in asset names into dots.
          for f in *\ *; do [ -e "$f" ] && mv "$f" "${f// /.}"; done
          ls -la

          base="https://github.com/isc-fs/iskapps/releases/download/$app_tag"
          one() { compgen -G "$1" | head -n1; }
          entry() {  # bundle -> {"signature","url"}
              jq -n --arg s "$(cat "$1.sig")" --arg u "$base/$1" '{signature: $s, url: $u}'
          }
          mac=$(one '*.app.tar.gz'); img=$(one '*.AppImage'); deb=$(one '*.deb'); exe=$(one '*-setup.exe')
          for f in "$mac" "$img" "$deb" "$exe"; do
              [ -n "$f" ] && [ -f "$f.sig" ] || { echo "missing a signed bundle"; exit 1; }
          done
          jq -n --arg v "$version" --arg d "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              --argjson mac "$(entry "$mac")" --argjson img "$(entry "$img")" \
              --argjson deb "$(entry "$deb")" --argjson exe "$(entry "$exe")" \
              '{version: $v, notes: "ISC vHIL \($v)", pub_date: $d, platforms: {
                  "darwin-aarch64": $mac, "darwin-x86_64": $mac,
                  "darwin-aarch64-app": $mac, "darwin-x86_64-app": $mac,
                  "linux-x86_64": $img, "linux-x86_64-appimage": $img, "linux-x86_64-deb": $deb,
                  "windows-x86_64": $exe, "windows-x86_64-nsis": $exe}}' > ../latest.json
          cat ../latest.json

          notes="ISC vHIL $version: the car's firmware on emulated boards, on your machine.

          | OS | Download | Needs first |
          |---|---|---|
          | macOS | \`$(one '*.dmg')\` | Homebrew |
          | Linux | \`$deb\` or \`$img\` | Git, Docker Engine |
          | Windows | \`$exe\` | WSL2 + Docker Desktop (WSL integration) |

          First launch and set-up: https://github.com/$REPO/blob/$TAG/app/README.md
          Installed apps update themselves."
          export GH_TOKEN="$ISKAPPS_TOKEN"
          if gh release view "$app_tag" --repo isc-fs/iskapps >/dev/null 2>&1; then
              gh release upload "$app_tag" ./* --repo isc-fs/iskapps --clobber
          else
              gh release create "$app_tag" ./* --repo isc-fs/iskapps \
                  --title "ISC vHIL $TAG" --notes "$notes"
          fi

          cd ..
          git clone --depth 1 "https://x-access-token:$ISKAPPS_TOKEN@github.com/isc-fs/iskapps.git" isk
          mkdir -p isk/vhil
          cp latest.json isk/vhil/latest.json
          cd isk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The apps table lists the vHIL once.
          if ! grep -qF 'vhil-v' README.md; then
              awk '{print} /^\| \*\*ISC MingoCAN\*\*/{print "| **ISC vHIL** | `vhil-v` | The car'"'"'s firmware on emulated boards, on your machine (IFS-vHIL) |"}' \
                  README.md > README.new && mv README.new README.md
          fi
          git add vhil/latest.json README.md
          if git diff --cached --quiet; then
              echo "manifest unchanged"
          else
              git commit -m "vhil: publish $TAG"
              git push origin HEAD:main
          fi
