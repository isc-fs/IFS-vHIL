name: App

# The desktop app (app/, #373): a universal macOS build (Apple silicon and
# Intel) on every pull request that changes it, and on a release tag, the
# .dmg attached to that tag's release. The app is ad-hoc signed, not
# notarised: app/README.md says how a teammate opens it the first time.
#
# The runner's preinstalled rustup and Node build it; the Tauri crates and
# CLI are pinned in app/src-tauri/Cargo.toml (+ Cargo.lock) and
# app/package-lock.json.

on:
  pull_request:
    paths: [app/**, .github/workflows/app.yml]
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: write   # attach the .dmg to a release
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - run: npm ci --no-audit --no-fund
      - name: Release version
        # A release build follows its tag: the app's version, and the ref its
        # own clone of the repository checks out (VHIL_APP_REF, main.rs).
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          npm pkg set version="${TAG#v}"
          echo "VHIL_APP_REF=$TAG" >> "$GITHUB_ENV"
      - name: Build
        run: npx tauri build --target universal-apple-darwin --bundles app,dmg
      - name: The bundle
        id: dmg
        run: |
          dmg=$(ls src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg)
          lipo -archs src-tauri/target/universal-apple-darwin/release/bundle/macos/vHIL.app/Contents/MacOS/vhil-app
          codesign -dv src-tauri/target/universal-apple-darwin/release/bundle/macos/vHIL.app 2>&1 | grep -E "Signature|Identifier"
          echo "path=app/$dmg" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vHIL-macos
          path: ${{ steps.dmg.outputs.path }}
          retention-days: 14
      - name: Attach to the release
        # The release is Raúl's to create; the .dmg joins it if it exists.
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          DMG: ${{ steps.dmg.outputs.path }}
        working-directory: .
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" "$DMG" --clobber
          else
              echo "no release $TAG yet: the .dmg is the run's artifact" >> "$GITHUB_STEP_SUMMARY"
          fi
