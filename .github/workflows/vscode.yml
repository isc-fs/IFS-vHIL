name: vscode

# The VS Code extension (vscode/README.md) on every pull request that
# changes it: compile, its tests (src/plan.ts) and the .vsix, kept as an
# artifact a teammate installs with `code --install-extension`. The runner's
# preinstalled Node builds it; the tools are pinned in vscode/package-lock.json.

on:
  pull_request:
    paths: [vscode/**, .github/workflows/vscode.yml]
  push:
    branches: [dev]
    paths: [vscode/**, .github/workflows/vscode.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npm ci
      - run: npm test
      - run: npm run package
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vhil-tests-vsix
          path: vscode/*.vsix
          if-no-files-found: error
