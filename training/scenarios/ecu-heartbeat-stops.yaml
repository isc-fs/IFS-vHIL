kind: training
title: "The AIRs open right after the car arms"
summary: "Precharge finishes and the car goes to Run, then the AMS drops to Error a moment later. The accumulator is fine. Find the bug."
level: 2
fault: firmware
topics: [CAN, ECU <-> AMS, heartbeat, firmware]
system: ecu-ams
firmware:
  ecu: 44610a5366ad5c785751a6eccb1cf4a8616890ca
  ams: 94b59a9e5bc5a5fe90705018ebcd8e6a23e851d0
# The seeded bug: one line of the pinned ECU commit (training/patches/).
seed:
  image: ecu
  patch: patches/ecu-heartbeat-precharge-only.patch
brief: |
  **From the workshop:** "Someone cleaned up the ECU's control task last night. Now the
  car precharges, the AIRs close, and a moment later they open again. The AMS shows
  Error. Nobody touched the AMS."

  Run the car. The hardware is fine: the fault is in **firmware**, but maybe not on the
  board that shows the error. Find which board, name the part of its firmware the bug
  is in, then fix it in the source and check your fix.
drive:
  # RST_EXT, TSMS on, one DASH_CHG press: how the car is armed.
  virtual_ms: 12000
  stimuli:
    - {kind: plant, name: sdc-reset, at_ms: 5400, plant: sdc, set: {reset: true}}
    - {kind: plant, name: sdc-reset-release, at_ms: 5450, plant: sdc, set: {reset: false}}
    - {kind: plant, name: tsms-on, at_ms: 5500, plant: sdc, set: {tsms: true}}
    - {kind: gpio, name: dash-press, at_ms: 5600, board: ams, pin: PF10, level: true}
    - {kind: gpio, name: dash-release, at_ms: 5650, board: ams, pin: PF10, level: false}
  watch:
    - {kind: symbol, board: ams, name: g_state_telemetry, size: 1, period_ms: 10}
    - {kind: symbol, board: ams, name: g_fault_reason_telemetry, size: 1, period_ms: 10}
    - {kind: symbol, board: ams, name: g_fault_detail_telemetry, size: 1, period_ms: 10}
    - {kind: symbol, board: ecu, name: g_last_ctrl_state, size: 1, period_ms: 10}
    - {kind: pin, board: ams, pin: PB4}
  # A healthy car: what the fixed one must do (test_solved).
  expect:
    - {check: never, name: no-ams-error, at_ms: 0, signal: "symbol:ams.g_state_telemetry", value: 5}
    - {check: always, name: ams-ok, at_ms: 4500, signal: "pin:ams.PB4", value: high}
    - {check: eventually, name: ams-run, at_ms: 5600, until_ms: 10600, signal: "symbol:ams.g_state_telemetry", value: 3}
    - {check: always, name: sdc-closed-in-run, at_ms: 10800, signal: "plant:sdc.sdc_closed", value: 1}
hints:
  - "Start where the error is: the AMS. Its fault reason (on the AMS box in the diagram, and on CAN 0x6C0) says what it gave up waiting for."
  - "Reason 11 is VcuStale: the AMS stopped hearing the ECU's (VCU's) 0x100 heartbeat on the ACU bus. Open the CAN trace tab, type 100 in the ids box, and find the last one the ECU sent. What did the ECU's state just change to?"
  - "The AMS is right to trip: in Car mode it must hear the ECU every 200 ms. So the ECU stopped sending. Find where its control task sends 0x100, and when it is allowed to."
answer:
  part: firmware
  board: ecu
  module: can_tx_heartbeat
  explain: |
    The ECU sent its 0x100 heartbeat only while it was in Precharge
    (Core/Src/app/control_task.cpp: `if (out.state == CtrlState::Precharge)`), instead
    of in every state, every 10 ms. The AMS locks Car mode when precharge starts and
    from then on requires a 0x100 frame at least every 200 ms (VcuStaleMs). As soon
    as precharge finished the ECU moved on to waiting for START + brake and went
    quiet; 200 ms later the AMS latched Error (reason 11, VcuStale), opened the AIRs
    and dropped AMS_OK. The symptom is on the AMS, the bug on the ECU: a heartbeat
    is a contract between two boards, and its message definition
    (vcu_heartbeat.def) says it must go out in every state.
fix_note: "Seeded for training: the team's ECU never shipped this."
sources:
  - training/patches/ecu-heartbeat-precharge-only.patch
solved:
  - "training/tests/test_puzzles.py::test_solved[ecu-heartbeat-stops]"
